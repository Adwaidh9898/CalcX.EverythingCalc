<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>CalcX — Everything Calculator</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

:root{
  --bg:#080a0f;
  --bg2:#0d1017;
  --panel:#11151d;
  --panel2:#171c26;
  --text:#f7f8fb;
  --muted:#8b94a7;
  --line:rgba(255,255,255,.08);
  --accent:#7c5cff;
  --accent2:#20d9a5;
  --danger:#ff5577;
  --warning:#ffd15c;
  --shadow:0 25px 70px rgba(0,0,0,.38);
  --radius:22px;
}

.light{
  --bg:#f3f5fa;
  --bg2:#fff;
  --panel:#fff;
  --panel2:#f0f2f7;
  --text:#151821;
  --muted:#687083;
  --line:rgba(0,0,0,.08);
  --shadow:0 20px 50px rgba(30,40,70,.12);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% -10%,rgba(124,92,255,.2),transparent 32%),
    radial-gradient(circle at 90% 20%,rgba(32,217,165,.08),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  overflow-x:hidden;
}

button,input,select{font:inherit}

button{cursor:pointer}

button:active{transform:scale(.96)}

::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#303747;border-radius:20px}

#particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(8,10,15,.72);
  backdrop-filter:blur(22px);
  border-bottom:1px solid var(--line);
}

.light .topbar{
  background:rgba(243,245,250,.78);
}

.nav{
  height:70px;
  max-width:1250px;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-family:"Space Grotesk";
  font-weight:700;
  font-size:21px;
}

.logo{
  width:39px;
  height:39px;
  border-radius:13px;
  display:grid;
  place-items:center;
  color:white;
  font-size:19px;
  background:linear-gradient(135deg,#6848ff,#aa91ff);
  box-shadow:0 10px 30px rgba(124,92,255,.35);
  position:relative;
  overflow:hidden;
}

.logo:after{
  content:"";
  position:absolute;
  width:80px;
  height:10px;
  background:rgba(255,255,255,.25);
  transform:rotate(-35deg);
  left:-90px;
  animation:shine 3.5s infinite;
}

@keyframes shine{
  0%,65%{left:-90px}
  100%{left:70px}
}

.navBtns{
  display:flex;
  gap:8px;
}

.iconBtn{
  width:42px;
  height:42px;
  border-radius:13px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  transition:.25s;
}

.iconBtn:hover{
  transform:translateY(-2px);
  border-color:rgba(124,92,255,.45);
}

.app{
  max-width:1250px;
  margin:auto;
  padding:0 18px 120px;
}

.hero{
  padding:44px 0 24px;
  animation:heroIn .7s ease both;
}

@keyframes heroIn{
  from{opacity:0;transform:translateY(22px)}
  to{opacity:1;transform:none}
}

.hero h1{
  margin:0;
  font-family:"Space Grotesk";
  font-size:clamp(38px,7vw,68px);
  line-height:.98;
  letter-spacing:-3px;
}

.gradient{
  background:linear-gradient(100deg,#fff 10%,#9c83ff 48%,#55e7c0);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.light .gradient{
  background:linear-gradient(100deg,#171821,#6848ff,#0b9f7a);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:var(--muted);
  max-width:700px;
  line-height:1.65;
  margin:16px 0 25px;
}

.search{
  height:58px;
  display:flex;
  align-items:center;
  gap:12px;
  background:rgba(17,21,29,.9);
  border:1px solid var(--line);
  border-radius:18px;
  padding:0 18px;
  box-shadow:var(--shadow);
  transition:.3s;
}

.light .search{background:#fff}

.search:focus-within{
  border-color:rgba(124,92,255,.7);
  box-shadow:0 0 0 4px rgba(124,92,255,.1),var(--shadow);
}

.search span{
  color:var(--muted);
  font-size:19px;
}

.search input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  color:var(--text);
  background:none;
  font-size:16px;
}

.stats{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin:19px 0 28px;
}

.pill{
  border:1px solid var(--line);
  background:var(--panel);
  padding:9px 13px;
  border-radius:100px;
  color:var(--muted);
  font-size:12px;
}

.pill b{color:var(--text)}

.sectionHead{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin:28px 0 13px;
}

.sectionHead h2{
  font-family:"Space Grotesk";
  margin:0;
  font-size:21px;
}

.sectionHead small{color:var(--muted)}

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:4px 0 12px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{display:none}

.category{
  white-space:nowrap;
  color:var(--muted);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 14px;
  transition:.25s;
}

.category:hover,
.category.active{
  color:white;
  background:rgba(124,92,255,.17);
  border-color:rgba(124,92,255,.55);
  transform:translateY(-2px);
}

.light .category:hover,
.light .category.active{color:#171821}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
}

.card{
  min-height:148px;
  position:relative;
  overflow:hidden;
  padding:18px;
  border-radius:var(--radius);
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  cursor:pointer;
  transition:
    transform .3s cubic-bezier(.2,.8,.2,1),
    border-color .3s,
    box-shadow .3s;
  animation:cardIn .45s ease both;
}

.card:before{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  top:-35px;
  left:-30px;
  background:var(--accent);
  filter:blur(50px);
  opacity:.1;
}

.card:hover{
  transform:translateY(-7px) scale(1.012);
  border-color:rgba(124,92,255,.4);
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(15px) scale(.97)}
  to{opacity:1;transform:none}
}

.cardIcon{
  font-size:27px;
  margin-bottom:17px;
}

.card h3{
  margin:0 0 7px;
  font-size:15px;
}

.card p{
  margin:0;
  color:var(--muted);
  line-height:1.45;
  font-size:12px;
}

.star{
  position:absolute;
  top:12px;
  right:12px;
  border:0;
  background:none;
  color:#60697a;
  font-size:18px;
  z-index:2;
}

.star.on{color:#ffd15c}

.empty{
  display:none;
  padding:60px 20px;
  text-align:center;
  color:var(--muted);
}

.bottom{
  position:fixed;
  z-index:60;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(510px,calc(100% - 24px));
  padding:8px;
  display:flex;
  gap:5px;
  border:1px solid var(--line);
  border-radius:23px;
  background:rgba(17,21,29,.9);
  backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}

.light .bottom{background:rgba(255,255,255,.9)}

.bnav{
  flex:1;
  padding:8px 5px;
  border:0;
  background:none;
  color:var(--muted);
  border-radius:16px;
  font-size:10px;
  transition:.25s;
}

.bnav span{
  display:block;
  font-size:19px;
  margin-bottom:3px;
}

.bnav.active{
  color:white;
  background:rgba(124,92,255,.17);
}

.light .bnav.active{color:#171821}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(12px);
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
  animation:fade .2s ease;
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}

.sheet{
  width:min(700px,100%);
  max-height:92vh;
  overflow:auto;
  padding:20px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:28px 28px 0 0;
  box-shadow:0 -30px 80px rgba(0,0,0,.4);
  animation:sheetIn .35s cubic-bezier(.2,.8,.2,1);
}

@keyframes sheetIn{
  from{transform:translateY(100%)}
  to{transform:none}
}

.sheetTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.sheetTitle{
  display:flex;
  align-items:center;
  gap:12px;
}

.sheetTitle .big{
  font-size:28px;
}

.sheetTitle h2{
  margin:0;
  font-family:"Space Grotesk";
  font-size:21px;
}

.sheetTitle p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px;
}

.close{
  width:42px;
  height:42px;
  border-radius:13px;
  background:var(--panel2);
  border:1px solid var(--line);
  color:var(--text);
}

.fields{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{grid-column:1/-1}

.field label{
  color:var(--muted);
  font-size:12px;
}

.field input,
.field select{
  width:100%;
  height:49px;
  padding:0 13px;
  outline:0;
  color:var(--text);
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:14px;
}

.field input:focus,
.field select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(124,92,255,.1);
}

.calculate{
  width:100%;
  min-height:52px;
  margin-top:15px;
  border-radius:15px;
  color:white;
  font-weight:700;
  background:linear-gradient(135deg,#6848ff,#8d75ff);
  box-shadow:0 10px 30px rgba(124,92,255,.25);
  transition:.25s;
}

.calculate:hover{transform:translateY(-2px)}

.result{
  margin-top:15px;
  padding:18px;
  border-radius:18px;
  background:linear-gradient(145deg,rgba(124,92,255,.14),rgba(32,217,165,.05));
  border:1px solid rgba(124,92,255,.25);
  display:none;
  animation:resultIn .4s ease;
}

@keyframes resultIn{
  from{opacity:0;transform:translateY(10px) scale(.98)}
  to{opacity:1;transform:none}
}

.result.show{display:block}

.result .label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:5px;
}

.result .value{
  font-family:"Space Grotesk";
  font-size:29px;
  font-weight:700;
  word-break:break-word;
}

.result .sub{
  color:var(--muted);
  font-size:12px;
  margin-top:8px;
  line-height:1.5;
}

.historyItem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:14px;
  margin-bottom:8px;
}

.historyItem small{color:var(--muted)}

.historyItem b{font-size:13px}

.clearHistory{
  padding:10px 13px;
  border-radius:12px;
  background:rgba(255,85,119,.1);
  color:#ff6e8b;
  border:1px solid rgba(255,85,119,.2);
}

/* SCIENTIFIC */

.sciDisplay{
  background:#080a0e;
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  margin-bottom:12px;
  min-height:105px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  text-align:right;
  overflow:hidden;
}

.light .sciDisplay{background:#eef0f5}

.sciExpr{
  color:var(--muted);
  min-height:25px;
  font-size:14px;
  word-break:break-all;
}

.sciValue{
  font-family:"Space Grotesk";
  font-size:34px;
  font-weight:600;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.sciKeys{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.key{
  min-height:52px;
  border-radius:14px;
  background:var(--panel2);
  border:1px solid var(--line);
  color:var(--text);
  transition:.16s;
}

.key:hover{
  background:rgba(124,92,255,.15);
  transform:translateY(-2px);
}

.key.op{color:#a896ff}
.key.equal{
  color:white;
  background:linear-gradient(135deg,#6848ff,#8d75ff);
}

/* TOAST */

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:95px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#181d28;
  border:1px solid var(--line);
  padding:12px 17px;
  border-radius:14px;
  box-shadow:var(--shadow);
  font-size:13px;
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* SPLASH */

.splash{
  position:fixed;
  z-index:500;
  inset:0;
  display:grid;
  place-items:center;
  background:#080a0f;
  transition:.7s;
}

.splash.hide{
  opacity:0;
  visibility:hidden;
  transform:scale(1.05);
}

.splashLogo{
  text-align:center;
  animation:splashPop .8s cubic-bezier(.2,.8,.2,1);
}

.splashLogo .sicon{
  width:72px;
  height:72px;
  margin:auto auto 15px;
  border-radius:23px;
  display:grid;
  place-items:center;
  font-size:34px;
  background:linear-gradient(135deg,#6848ff,#a88cff);
  box-shadow:0 20px 60px rgba(124,92,255,.35);
}

.splashLogo h1{
  font-family:"Space Grotesk";
  margin:0;
}

.splashLogo p{
  color:#778093;
  margin:7px 0 0;
  font-size:12px;
}

.loader{
  width:100px;
  height:3px;
  background:#202532;
  margin:20px auto 0;
  overflow:hidden;
  border-radius:20px;
}

.loader i{
  display:block;
  width:45%;
  height:100%;
  background:#8d75ff;
  animation:load 1.2s infinite;
}

@keyframes load{
  from{transform:translateX(-120%)}
  to{transform:translateX(330%)}
}

@keyframes splashPop{
  from{opacity:0;transform:scale(.75)}
  to{opacity:1;transform:none}
}

/* RESPONSIVE */

@media(max-width:900px){
  .grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:650px){
  .app{padding:0 13px 115px}
  .nav{padding:0 13px}
  .hero{padding-top:32px}
  .hero h1{font-size:43px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card{min-height:140px;padding:15px}
  .fields{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .sheet{padding:17px;border-radius:25px 25px 0 0}
}

@media(max-width:380px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="splash" id="splash">
  <div class="splashLogo">
    <div class="sicon">∑</div>
    <h1>CalcX</h1>
    <p>Everything calculated.</p>
    <div class="loader"><i></i></div>
  </div>
</div>

<header class="topbar">
  <nav class="nav">
    <div class="brand">
      <div class="logo">∑</div>
      <span>CalcX</span>
    </div>

    <div class="navBtns">
      <button class="iconBtn" onclick="showHistory()">↺</button>
      <button class="iconBtn" onclick="toggleTheme()" id="themeBtn">☾</button>
    </div>
  </nav>
</header>

<main class="app">

<section class="hero">
  <h1>Calculate<br><span class="gradient">anything.</span></h1>
  <p>
    One powerful calculator hub for math, money, conversions, health,
    students, everyday life and more.
  </p>

  <div class="search">
    <span>⌕</span>
    <input id="search" placeholder="Search calculators..." oninput="searchTools()">
    <span id="searchCount"></span>
  </div>

  <div class="stats">
    <div class="pill"><b id="toolCount">0</b> tools</div>
    <div class="pill"><b>Offline</b> ready</div>
    <div class="pill"><b>Free</b> forever</div>
  </div>
</section>

<div class="sectionHead">
  <h2>Explore tools</h2>
  <small id="currentLabel">All calculators</small>
</div>

<div class="categories" id="categories"></div>

<div class="grid" id="grid"></div>

<div class="empty" id="empty">
  <div style="font-size:40px">⌕</div>
  <h3>No calculators found</h3>
  <p>Try another search term.</p>
</div>

</main>

<nav class="bottom">
  <button class="bnav active" onclick="setPage('home',this)">
    <span>⌂</span>Home
  </button>
  <button class="bnav" onclick="setPage('favorites',this)">
    <span>☆</span>Favorites
  </button>
  <button class="bnav" onclick="openScientific()">
    <span>∑</span>Scientific
  </button>
  <button class="bnav" onclick="showHistory()">
    <span>◷</span>History
  </button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CALCX — ALL-IN-ONE CALCULATOR
========================================================= */

const tools = [

/* BASIC */
{id:"percentage",name:"Percentage",cat:"Math",icon:"%",desc:"Find percentages, increases and decreases.",fields:[
 ["value","Value","number"],["percent","Percentage","number"]
],calc:d=>({v:(d.value*d.percent/100),label:"Result",sub:`${d.percent}% of ${d.value}`})},

{id:"percentchange",name:"Percentage Change",cat:"Math",icon:"↗",desc:"Calculate percentage increase or decrease.",fields:[
 ["old","Original value","number"],["new","New value","number"]
],calc:d=>({v:((d.new-d.old)/d.old*100).toFixed(2)+"%",label:"Percentage change",sub:d.new>=d.old?"Increase":"Decrease"})},

{id:"average",name:"Average",cat:"Math",icon:"≈",desc:"Calculate the average of numbers.",fields:[
 ["nums","Numbers","text","10,20,30,40"]
],calc:d=>{let a=d.nums.split(",").map(Number).filter(x=>!isNaN(x));return {v:(a.reduce((x,y)=>x+y,0)/a.length).toFixed(4),label:"Average",sub:`${a.length} numbers`}}},

{id:"ratio",name:"Ratio",cat:"Math",icon:"∶",desc:"Simplify a ratio.",fields:[
 ["a","First number","number"],["b","Second number","number"]
],calc:d=>{let g=gcd(d.a,d.b);return {v:`${d.a/g} : ${d.b/g}`,label:"Simplified ratio"}}},

{id:"gcd",name:"GCD / HCF",cat:"Math",icon:"G",desc:"Find greatest common divisor.",fields:[
 ["a","Number A","number"],["b","Number B","number"]
],calc:d=>({v:gcd(d.a,d.b),label:"GCD / HCF"})},

{id:"lcm",name:"LCM",cat:"Math",icon:"L",desc:"Find least common multiple.",fields:[
 ["a","Number A","number"],["b","Number B","number"]
],calc:d=>({v:Math.abs(d.a*d.b)/gcd(d.a,d.b),label:"LCM"})},

{id:"power",name:"Power Calculator",cat:"Math",icon:"xⁿ",desc:"Calculate any number raised to a power.",fields:[
 ["a","Base","number"],["b","Exponent","number"]
],calc:d=>({v:Math.pow(d.a,d.b),label:"Result"})},

{id:"sqrt",name:"Square Root",cat:"Math",icon:"√",desc:"Find square and cube roots.",fields:[
 ["a","Number","number"]
],calc:d=>({v:Math.sqrt(d.a),label:"Square root",sub:`Cube root: ${Math.cbrt(d.a)}`})},

{id:"quadratic",name:"Quadratic Equation",cat:"Math",icon:"x²",desc:"Solve ax² + bx + c = 0.",fields:[
 ["a","A","number"],["b","B","number"],["c","C","number"]
],calc:d=>{let disc=d.b*d.b-4*d.a*d.c;if(disc<0)return{v:"No real roots",label:"Result",sub:"Discriminant is negative"};return{v:`x₁=${((-d.b+Math.sqrt(disc))/(2*d.a)).toFixed(5)}`,label:"Roots",sub:`x₂=${((-d.b-Math.sqrt(disc))/(2*d.a)).toFixed(5)}`}}},

{id:"factorial",name:"Factorial",cat:"Math",icon:"n!",desc:"Calculate n factorial.",fields:[
 ["n","Number","number"]
],calc:d=>{let n=Math.floor(d.n),r=1;for(let i=2;i<=n;i++)r*=i;return{v:r,label:"Factorial"}}},

{id:"discount",name:"Discount",cat:"Finance",icon:"🏷️",desc:"Calculate sale price and savings.",fields:[

const categories=["All","Math","Finance","Convert","Health","Student","Everyday","Geometry","Tech","Other"];

let favorites=JSON.parse(localStorage.getItem("calcx_favorites")||"[]");
let history=JSON.parse(localStorage.getItem("calcx_history")||"[]");
let activeCat="All";
let currentPage="home";

document.getElementById("toolCount").textContent=tools.length;

function save(){
  localStorage.setItem("calcx_favorites",JSON.stringify(favorites));
  localStorage.setItem("calcx_history",JSON.stringify(history.slice(0,30)));
}

function gcd(a,b){
  a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));
  while(b){let t=b;b=a%b;a=t}
  return a||1;
}

function esc(x){
  return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function renderCategories(){
  document.getElementById("categories").innerHTML=categories.map(c=>
    `<button class="category ${activeCat===c?"active":""}" onclick="selectCategory('${c}')">${c}</button>`
  ).join("");
}

function selectCategory(c){
  activeCat=c;
  currentPage="home";
  document.getElementById("search").value="";
  renderCategories();
  renderTools();
  document.getElementById("currentLabel").textContent=c==="All"?"All calculators":c;
  window.scrollTo({top:300,behavior:"smooth"});
}

function renderTools(){
  let q=document.getElementById("search").value.toLowerCase().trim();

  let list=tools.filter(t=>{
    let cat=activeCat==="All"||t.cat===activeCat;
    let search=!q||(t.name+" "+t.cat+" "+t.desc).toLowerCase().includes(q);
    let fav=currentPage==="favorites"?favorites.includes(t.id):true;
    return cat&&search&&fav;
  });

  const grid=document.getElementById("grid");
  const empty=document.getElementById("empty");

  grid.innerHTML=list.map((t,i)=>`
    <article class="card" style="animation-delay:${Math.min(i*25,350)}ms" onclick="openTool('${t.id}')">
      <button class="star ${favorites.includes(t.id)?"on":""}" onclick="event.stopPropagation();toggleFav('${t.id}')">
        ${favorites.includes(t.id)?"★":"☆"}
      </button>
      <div class="cardIcon">${t.icon}</div>
      <h3>${esc(t.name)}</h3>
      <p>${esc(t.desc)}</p>
    </article>
  `).join("");

  empty.style.display=list.length?"none":"block";

  document.getElementById("searchCount").textContent=q?list.length:"";
}

function searchTools(){
  activeCat="All";
  renderCategories();
  renderTools();
  document.getElementById("currentLabel").textContent="Search results";
}

function toggleFav(id){
  if(favorites.includes(id)){
    favorites=favorites.filter(x=>x!==id);
    toast("Removed from favorites");
  }else{
    favorites.push(id);
    toast("Added to favorites ⭐");
  }
  save();
  renderTools();
}

function setPage(page,btn){
  document.querySelectorAll(".bnav").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  currentPage=page;
  activeCat="All";
  document.getElementById("search").value="";
  renderCategories();
  renderTools();
  document.getElementById("currentLabel").textContent=page==="favorites"?"Your favorites":"All calculators";
  window.scrollTo({top:250,behavior:"smooth"});
}

function openTool(id){
  let t=tools.find(x=>x.id===id);
  if(!t)return;

  let fields=t.fields.map(f=>{
    let [key,label,type,opts]=f;

    if(type==="select"){
      let options=opts.split("|").map(o=>`<option>${esc(o)}</option>`).join("");
      return `<div class="field">
        <label>${esc(label)}</label>
        <select id="f_${key}">${options}</select>
      </div>`;
    }

    return `<div class="field">
      <label>${esc(label)}</label>
      <input id="f_${key}" type="${type}" ${type==="text"?"":"step='any'"} placeholder="${opts||""}">
    </div>`;
  }).join("");

  document.getElementById("sheet").innerHTML=`
    <div class="sheetTop">
      <div class="sheetTitle">
        <div class="big">${t.icon}</div>
        <div>
          <h2>${esc(t.name)}</h2>
          <p>${esc(t.desc)}</p>
        </div>
      </div>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="fields">${fields}</div>

    <button class="calculate" onclick="calculate('${t.id}')">
      Calculate →
    </button>

    <div class="result" id="result">
      <div class="label" id="resultLabel"></div>
      <div class="value" id="resultValue"></div>
      <div class="sub" id="resultSub"></div>
    </div>
  `;

  showModal();
}

function getData(t){
  let d={};

  t.fields.forEach(f=>{
    let el=document.getElementById("f_"+f[0]);
    let value=el?el.value:"";
    d[f[0]]=f[2]==="number"?parseFloat(value):value;
  });

  return d;
}

function calculate(id){
  let t=tools.find(x=>x.id===id);

  try{
    let d=getData(t);

    for(let f of t.fields){
      if(f[2]==="number" && !isFinite(d[f[0]])){
        toast("Please enter all numbers");
        return;
      }
    }

    let r=t.calc(d);

    document.getElementById("resultLabel").textContent=r.label||"Result";
    document.getElementById("resultValue").textContent=r.v;
    document.getElementById("resultSub").textContent=r.sub||"";

    document.getElementById("result").classList.add("show");

    history.unshift({
      name:t.name,
      value:String(r.v),
      time:new Date().toLocaleString()
    });

    save();
    burst();
  }catch(e){
    toast("Check the values and try again");
  }
}

function showModal(){
  document.getElementById("modal").classList.add("show");
  document.body.style.overflow="hidden";
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
  document.body.style.overflow="";
}

function showHistory(){
  let content=history.length?
    history.map(h=>`
      <div class="historyItem">

          <b>${esc(h.name)}</b>
          <small style="display:block">${esc(h.time)}</small>

let sciExpression="";
let lastAnswer=0;

function sci(x){
  const expr=document.getElementById("sciExpr");
  const val=document.getElementById("sciValue");

  if(x==="clear"){
    sciExpression="";
    val.textContent="0";
    expr.textContent="";
    return;
  }

  if(x==="back"){
    sciExpression=sciExpression.slice(0,-1);
    val.textContent=sciExpression||"0";
    return;
  }

  if(x==="="){
    try{
      let e=sciExpression
        .replace(/π/g,"Math.PI")
        .replace(/sin\(/g,"Math.sin(")
        .replace(/cos\(/g,"Math.cos(")
        .replace(/tan\(/g,"Math.tan(")
        .replace(/sqrt\(/g,"Math.sqrt(")
        .replace(/log\(/g,"Math.log10(")
        .replace(/ln\(/g,"Math.log(")
        .replace(/\^/g,"**")
        .replace(/%/g,"/100");

      let result=Function('"use strict";return ('+e+')')();

      if(!isFinite(result))throw Error();

      lastAnswer=result;
      expr.textContent=sciExpression+" =";
      val.textContent=formatNumber(result);
      sciExpression=String(result);
      history.unshift({
        name:"Scientific Calculator",
        value:String(result),
        time:new Date().toLocaleString()
      });
      save();
      burst();
    }catch{
      val.textContent="Error";
    }
    return;
  }

  if(x==="ans")x=String(lastAnswer);

  if(["sin","cos","tan","sqrt","log","ln"].includes(x)){
    sciExpression+=x+"(";
  }else if(x==="pi"){
    sciExpression+="π";
  }else{
    sciExpression+=x;
  }

  val.textContent=sciExpression;
}

function formatNumber(n){
  if(Math.abs(n)>1e12||Math.abs(n)<1e-7&&n!==0)return n.toExponential(8);
  return Number(n.toFixed(10)).toString();
}

/* UNIT CONVERTERS */

const units={
length:{
"Meter":1,"Kilometer":1000,"Centimeter":.01,"Millimeter":.001,
"Mile":1609.344,"Yard":.9144,"Foot":.3048,"Inch":.0254
},
weight:{
"Kilogram":1,"Gram":.001,"Milligram":.000001,
"Pound":.45359237,"Ounce":.0283495,"Ton":1000
},
area:{
"Square meter":1,"Square kilometer":1e6,"Square foot":.092903,
"Square yard":.836127,"Acre":4046.856422,"Hectare":10000
},
volume:{
"Liter":1,"Milliliter":.001,"Cubic meter":1000,
"Gallon":3.785411784,"Cup":.2365882365,"Fluid ounce":.0295735296
},
speed:{
"km/h":1,"m/s":3.6,"mph":1.609344,"knot":1.852
},
data:{
"Byte":1,"KB":1024,"MB":1024**2,"GB":1024**3,"TB":1024**4
},
time:{
"Second":1,"Minute":60,"Hour":3600,"Day":86400,"Week":604800
}
};

function convertUnit(value,from,to,type){
  let u=units[type];
  return (value*u[from]/u[to]).toPrecision(10);
}

function tempConvert(v,from,to){
  let c;
  if(from==="Celsius")c=v;
  else if(from==="Fahrenheit")c=(v-32)*5/9;
  else c=v-273.15;

  if(to==="Celsius")return c;
  if(to==="Fahrenheit")return c*9/5+32;
  return c+273.15;
}

/* PARTICLES */

const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
let particles=[];

function resizeCanvas(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}

function makeParticles(){
  particles=Array.from({length:35},()=>({
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    r:Math.random()*1.7+.3,
    vx:(Math.random()-.5)*.25,
    vy:(Math.random()-.5)*.25,
    a:Math.random()*.4+.1
  }));
}

function particleLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let p of particles){
    p.x+=p.vx;
    p.y+=p.vy;

    if(p.x<0)p.x=innerWidth;
    if(p.x>innerWidth)p.x=0;
    if(p.y<0)p.y=innerHeight;
    if(p.y>innerHeight)p.y=0;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(150,130,255,${p.a})`;
    ctx.fill();
  }

  requestAnimationFrame(particleLoop);
}

function burst(){
  for(let i=0;i<18;i++){
    let el=document.createElement("span");
    el.style.position="fixed";
    el.style.left="50%";
    el.style.top="50%";
    el.style.width="5px";
    el.style.height="5px";
    el.style.borderRadius="50%";
    el.style.background=i%2?"#20d9a5":"#8d75ff";
    el.style.zIndex="300";
    el.style.pointerEvents="none";

    let a=Math.random()*Math.PI*2;
    let d=40+Math.random()*110;

    el.animate([
      {transform:"translate(-50%,-50%) scale(1)",opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(0)`,opacity:0}
    ],{
      duration:500+Math.random()*300,
      easing:"cubic-bezier(.2,.8,.2,1)"
    });

    document.body.appendChild(el);
    setTimeout(()=>el.remove(),900);
  }
}

window.addEventListener("resize",resizeCanvas);

resizeCanvas();
makeParticles();
particleLoop();

renderCategories();
renderTools();

setTimeout(()=>{
  document.getElementById("splash").classList.add("hide");
},900);

document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeModal();
});

</script>
